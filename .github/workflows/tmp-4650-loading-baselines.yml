name: Temporary 4650 loading indicator baseline generation

on:
  push:
    branches:
      - tmp/4650-loading-baselines

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          npm ci
          npm run bootstrap -- -- --ci
      - name: Build
        run: npm run build
      - name: Install Cypress
        run: npm run cypress:install:react
      - name: Regenerate affected loading indicator baselines
        run: |
          rm -f packages/react/cypress-image-diff-screenshots/baseline/IcLoadingIndicator.cy.tsx/loading-indicator-within-dialog-small.png
          rm -f packages/react/cypress-image-diff-screenshots/baseline/IcLoadingIndicator.cy.tsx/loading-indicator-within-dialog-custom-diameter.png
          cd packages/react
          CYPRESS_CI=true npx cypress run --component --headless --spec src/component-tests/IcLoadingIndicator/IcLoadingIndicator.cy.tsx
      - name: Commit generated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/react/cypress-image-diff-screenshots/baseline/IcLoadingIndicator.cy.tsx/loading-indicator-within-dialog-small.png
          git add packages/react/cypress-image-diff-screenshots/baseline/IcLoadingIndicator.cy.tsx/loading-indicator-within-dialog-custom-diameter.png
          git commit --no-verify -m "chore: generate 4650 loading indicator CI baselines"
          git push origin HEAD:tmp/4650-loading-baselines
